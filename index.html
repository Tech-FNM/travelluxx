    <!-- Global Google Maps Error & Watermark Suppression -->
    <script>
      window.gm_authFailure = function() {
        console.warn("Google Maps notice handled.");
      };
      if (typeof window !== "undefined") {
        function suppressGoogleOverlays() {
          const errModal = document.querySelector('.gm-err-container, .dismissButton');
          if (errModal) {
            const btn = document.querySelector('.dismissButton');
            if (btn) {
              try { btn.click(); } catch(e) {}
            }
            try { errModal.remove(); } catch(e) {}
          }
          const pbc = document.querySelectorAll('.gm-style-pbc, .gm-style-pbt, .gm-style-moc');
          pbc.forEach(function(el) {
            el.style.setProperty('display', 'none', 'important');
          });
        }
        const observer = new MutationObserver(suppressGoogleOverlays);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        setInterval(suppressGoogleOverlays, 300);
      }
    </script>
    <!-- Leaflet Map JS -->
